[package]
name = "bloco-notas-avancado"
version = "0.1.0"
edition = "2021"

[lib]
name = "bloco_notas_avancado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
